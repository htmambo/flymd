name: Build Multi-Platform

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

# 门禁（typecheck / 测试 / fmt / 构建）先跑，失败则不进入耗时的跨平台打包。
permissions:
  contents: read

jobs:
  # 轻量门禁：PR / 推主干时跑，避免为一次改动付出三平台完整打包的代价。
  check:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # jsdom@30 要求 ^22.22.2 || ^24.15.0 || >=26.0.0
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build frontend
        run: pnpm build

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        components: rustfmt

      - name: cargo fmt --check
        working-directory: src-tauri
        run: cargo fmt --check

  build:
    # 门禁先行：check 失败就不再进行耗时的跨平台打包
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-2022
            os: Windows
            arch: x64
          - platform: ubuntu-22.04
            os: Linux
            arch: x64
          - platform: macos-14
            os: macOS
            arch: universal

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # jsdom@30 要求 ^22.22.2 || ^24.15.0 || >=26.0.0；vite@8 要求 ^20.19 || >=22.12
          node-version: 22
          cache: 'pnpm'

      # 与仓库的打包脚本保持一致：一律以 pnpm-lock.yaml 为准
      # typecheck / 测试 / fmt 已由 needs: check 的门禁 job 覆盖
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos-') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # Windows 特定依赖
      - name: Install Windows bundlers (NSIS + WiX)
        if: matrix.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis -y
          choco install wixtoolset -y

      - name: Install Windows build prerequisites (CMake + NASM)
        if: matrix.os == 'Windows'
        shell: pwsh
        run: |
          choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y
          choco install nasm -y

      # Linux 特定依赖
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            build-essential \
            curl \
            wget \
            file \
            patchelf \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Generate icons from Flymdnew.png
        run: pnpm exec tauri icon ./Flymdnew.png
      - name: Install macOS DMG toolchain
        if: startsWith(matrix.platform, 'macos-')
        run: |
          brew update || true
          brew list create-dmg >/dev/null 2>&1 || brew install create-dmg
          xcrun --find SetFile >/dev/null 2>&1 || sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer || true
      - name: Build .app (macOS Universal)
        if: startsWith(matrix.platform, 'macos-')
        env:
          RUST_LOG: trace
          TAURI_BUNDLER_TARGET: universal-apple-darwin
        run: npm run tauri:build -- --bundles app --target universal-apple-darwin --verbose
      - name: Zip .app for convenience (macOS)
        if: startsWith(matrix.platform, 'macos-')
        run: |
          APP_DIR="src-tauri/target/universal-apple-darwin/release/bundle/macos/flymd.app"
          OUT_DIR="src-tauri/target/universal-apple-darwin/release/bundle/macos"
          if [ -d "$APP_DIR" ]; then
            (cd "$OUT_DIR" && zip -qry flymd_${{ matrix.arch }}.app.zip flymd.app)
          fi
      - name: Build DMG (macOS Universal, with fallback)
        if: startsWith(matrix.platform, 'macos-')
        env:
          RUST_LOG: trace
          TAURI_BUNDLER_TARGET: universal-apple-darwin
        run: |
          set -e
          APP_DIR="src-tauri/target/universal-apple-darwin/release/bundle/macos/flymd.app"
          DMG_DIR="src-tauri/target/universal-apple-darwin/release/bundle/dmg"
          mkdir -p "$DMG_DIR"
          echo "== Try tauri bundler (dmg) =="
          if npm run tauri:build -- --bundles dmg --target universal-apple-darwin --verbose; then
            echo "Tauri DMG build OK"
          else
            echo "::warning::Tauri DMG failed. Fallback to create-dmg"
            brew list create-dmg >/dev/null 2>&1 || brew install create-dmg
            OUT_DMG="$DMG_DIR/flymd_${{ matrix.arch }}.dmg"
            if [ ! -d "$APP_DIR" ]; then
              echo "::error::App not found for DMG fallback: $APP_DIR"
              exit 1
            fi
            rm -f "$OUT_DMG"
            create-dmg --dmg-title "flymd" --volname "flymd" --icon-size 128 \
              --app-drop-link 480 180 --icon "flymd.app" 160 180 \
              "$OUT_DMG" "$APP_DIR" || { echo "::error::Fallback create-dmg failed"; ls -la "$DMG_DIR"; exit 1; }
          fi
      - name: Upload DMG workdir on failure
        if: failure() && startsWith(matrix.platform, 'macos-')
        uses: actions/upload-artifact@v4
        with:
          name: dmg-workdir-${{ matrix.arch }}
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/

      - name: Build Tauri app (Windows)
        if: matrix.os == 'Windows'
        run: npm run tauri:build -- --bundles nsis
      - name: Build Tauri app (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: npm run tauri:build -- --bundles deb appimage

      - name: Create portable zip (Windows)
        if: matrix.os == 'Windows'
        shell: pwsh
        run: |
          $exe = "src-tauri/target/release/flymd.exe"
          if (!(Test-Path $exe)) { throw "portable: exe not found: $exe" }
          $outDir = "src-tauri/target/release/bundle/portable"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          $zip = Join-Path $outDir "flymd_portable_${{ matrix.arch }}.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path $exe -DestinationPath $zip -Force

      - name: Upload artifacts (Windows Portable)
        if: matrix.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: flymd-${{ matrix.os }}-${{ matrix.arch }}-portable
          path: src-tauri/target/release/bundle/portable/*.zip
          if-no-files-found: error

      - name: Upload artifacts (Windows)
        if: matrix.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: flymd-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Upload artifacts (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: flymd-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: warn

      - name: Upload artifacts (macOS)
        if: startsWith(matrix.platform, 'macos-')
        uses: actions/upload-artifact@v4
        with:
          name: flymd-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.zip
          if-no-files-found: warn

  # 可选：创建 Release
  create-release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            flymd-Windows-x64/**/*
            flymd-Windows-x64-portable/**/*
            flymd-Linux-x64/**/*
            flymd-macOS-universal/**/*
          draft: true
          generate_release_notes: true






