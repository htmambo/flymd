name: Build Multi-Platform

on:
  workflow_dispatch:
  push:
    # 推主干：只跑轻量门禁（check job），不跑三平台完整打包
    branches:
      - main
    # 打 tag：门禁 + 三平台打包 + 建 Release
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

# 门禁（typecheck / 测试 / fmt / 构建）先跑，失败则不进入耗时的跨平台打包。
permissions:
  contents: read

jobs:
  # 轻量门禁：PR / 推主干时跑，避免为一次改动付出三平台完整打包的代价。
  check:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # 不写 version：版本统一由 package.json 的 packageManager（pnpm@10.28.0）决定。
        # pnpm/action-setup@v4 新版会同时检查 action 的 version 输入与 packageManager，
        # 两者都写会直接报 "Multiple versions of pnpm specified" 而失败。

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Node 24：pdfjs-dist 6.3.x 使用 Promise.try（需 Node 23+），
          # Node 22 下会在 outline.test.ts 抛未捕获错误导致门禁失败；
          # 同时满足 jsdom@30（^22.22.2 || ^24.15.0 || >=26.0.0）
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm test

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test MCP server
        run: cargo test --manifest-path mcp-server/Cargo.toml

      # Tauri 侧的 Rust 代码此前只在三平台 build job 里才编译（30 分钟后才知道
      # 编不过）。这里加一道 cargo check 门禁：src-tauri 以路径依赖引用
      # mcp-server 的 lib（共享 AI 写入护栏核心），这类跨 crate 的依赖问题
      # 必须尽早暴露。
      #
      # cargo check 仍会跑依赖的 build script（pkg-config 探测系统库），
      # 所以必须装 GTK/WebKit 开发包——与 Linux build job 同一套。
      - name: Install Linux build dependencies for cargo check
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            build-essential \
            curl \
            wget \
            file \
            patchelf \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Check Tauri app (Rust)
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Build frontend
        run: pnpm build

      # 暂不启用 cargo fmt --check：本仓库的 Rust 代码从未按 rustfmt 格式化
      # （main.rs 用 2 空格缩进，rustfmt 默认 4），启用会让每一次 CI 直接失败。
      # 若要启用，需要先单独做一次全量格式化并单独提 PR —— 那个 diff 会
      # 覆盖整个 src-tauri/src/main.rs（4200+ 行），不适合与逻辑改动混在一起。

      # Tauri webview 里的 JS 报错只有带 sourcemap 才定位得到文件/行号，
      # 而正式构建默认不带。产出一份带 map 的构建供排查用户现场问题，
      # 只作为工件上传，不进入分发包。
      - name: Build with sourcemap (for debugging user reports)
        run: BUILD_SOURCEMAP=1 pnpm build

      - name: Upload sourcemap build
        uses: actions/upload-artifact@v4
        with:
          name: dist-with-sourcemap
          path: dist
          retention-days: 14

  build:
    # 门禁先行：check 失败就不再进行耗时的跨平台打包
    # 三平台打包在「打 tag」与「PR」时跑；推主干只跑 check 门禁——
    # 主干推送随后必然伴随一次 tag 构建，不必重复付出完整打包的代价。
    needs: check
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-2022
            os: Windows
            arch: x64
          - platform: ubuntu-22.04
            os: Linux
            arch: x64
          - platform: macos-14
            os: macOS
            arch: universal

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # 不写 version：版本统一由 package.json 的 packageManager（pnpm@10.28.0）决定。
        # pnpm/action-setup@v4 新版会同时检查 action 的 version 输入与 packageManager，
        # 两者都写会直接报 "Multiple versions of pnpm specified" 而失败。

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Node 24：pdfjs-dist 6.3.x 使用 Promise.try（需 Node 23+），
          # Node 22 下会在 outline.test.ts 抛未捕获错误导致门禁失败；
          # 同时满足 jsdom@30（^22.22.2 || ^24.15.0 || >=26.0.0）与 vite@8（^20.19 || >=22.12）
          node-version: 24
          cache: 'pnpm'

      # 与仓库的打包脚本保持一致：一律以 pnpm-lock.yaml 为准
      # typecheck / 测试 / fmt 已由 needs: check 的门禁 job 覆盖
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos-') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # MCP 服务器（mcp-server/ 独立 crate）：构建各平台二进制。
      # 产物既注入应用包，也作为独立工件随 Release 分发。
      - name: Build MCP server (macOS universal)
        if: startsWith(matrix.platform, 'macos-')
        run: node scripts/build-mcp-server.mjs --universal

      - name: Build MCP server (Windows)
        if: matrix.os == 'Windows'
        run: node scripts/build-mcp-server.mjs --target x86_64-pc-windows-msvc

      - name: Build MCP server (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: node scripts/build-mcp-server.mjs --target x86_64-unknown-linux-gnu

      # Windows 特定依赖
      - name: Install Windows bundlers (NSIS + WiX)
        if: matrix.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis -y
          choco install wixtoolset -y

      - name: Install Windows build prerequisites (CMake + NASM)
        if: matrix.os == 'Windows'
        shell: pwsh
        run: |
          choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y
          choco install nasm -y

      # Linux 特定依赖
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            build-essential \
            curl \
            wget \
            file \
            patchelf \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Generate icons from Flymdnew.png
        run: pnpm exec tauri icon ./Flymdnew.png
      - name: Install macOS DMG toolchain
        if: startsWith(matrix.platform, 'macos-')
        run: |
          brew update || true
          brew list create-dmg >/dev/null 2>&1 || brew install create-dmg
          xcrun --find SetFile >/dev/null 2>&1 || sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer || true
      - name: Build .app (macOS Universal)
        if: startsWith(matrix.platform, 'macos-')
        env:
          RUST_LOG: trace
          TAURI_BUNDLER_TARGET: universal-apple-darwin
        run: npm run tauri:build -- --bundles app --target universal-apple-darwin --verbose
      - name: Inject MCP server into .app bundle (macOS)
        if: startsWith(matrix.platform, 'macos-')
        run: node scripts/bundle-mcp-server.mjs --triple universal-apple-darwin
      - name: Zip .app for convenience (macOS)
        if: startsWith(matrix.platform, 'macos-')
        run: |
          APP_DIR="src-tauri/target/universal-apple-darwin/release/bundle/macos/flymd.app"
          OUT_DIR="src-tauri/target/universal-apple-darwin/release/bundle/macos"
          if [ -d "$APP_DIR" ]; then
            (cd "$OUT_DIR" && zip -qry flymd_${{ matrix.arch }}.app.zip flymd.app)
          fi
      - name: Build DMG (macOS Universal, with fallback)
        if: startsWith(matrix.platform, 'macos-')
        env:
          RUST_LOG: trace
          TAURI_BUNDLER_TARGET: universal-apple-darwin
        run: |
          set -e
          APP_DIR="src-tauri/target/universal-apple-darwin/release/bundle/macos/flymd.app"
          DMG_DIR="src-tauri/target/universal-apple-darwin/release/bundle/dmg"
          mkdir -p "$DMG_DIR"
          echo "== Try tauri bundler (dmg) =="
          if npm run tauri:build -- --bundles dmg --target universal-apple-darwin --verbose; then
            echo "Tauri DMG build OK"
          else
            echo "::warning::Tauri DMG failed. Fallback to create-dmg"
            brew list create-dmg >/dev/null 2>&1 || brew install create-dmg
            OUT_DMG="$DMG_DIR/flymd_${{ matrix.arch }}.dmg"
            if [ ! -d "$APP_DIR" ]; then
              echo "::error::App not found for DMG fallback: $APP_DIR"
              exit 1
            fi
            rm -f "$OUT_DMG"
            create-dmg --dmg-title "flymd" --volname "flymd" --icon-size 128 \
              --app-drop-link 480 180 --icon "flymd.app" 160 180 \
              "$OUT_DMG" "$APP_DIR" || { echo "::error::Fallback create-dmg failed"; ls -la "$DMG_DIR"; exit 1; }
          fi
      - name: Upload DMG workdir on failure
        if: failure() && startsWith(matrix.platform, 'macos-')
        uses: actions/upload-artifact@v4
        with:
          name: dmg-workdir-${{ matrix.arch }}
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/

      # Windows / Linux：把 MCP 服务器放到主程序同级目录，随安装包一起分发
      - name: Stage MCP server next to app binary (Windows/Linux)
        if: matrix.os == 'Windows' || matrix.platform == 'ubuntu-22.04'
        run: node scripts/bundle-mcp-server.mjs

      - name: Build Tauri app (Windows)
        if: matrix.os == 'Windows'
        run: npm run tauri:build -- --bundles nsis
      - name: Build Tauri app (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: npm run tauri:build -- --bundles deb appimage

      - name: Create portable zip (Windows)
        if: matrix.os == 'Windows'
        shell: pwsh
        run: |
          $exe = "src-tauri/target/release/flymd.exe"
          if (!(Test-Path $exe)) { throw "portable: exe not found: $exe" }
          $outDir = "src-tauri/target/release/bundle/portable"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          $zip = Join-Path $outDir "flymd_portable_${{ matrix.arch }}.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path $exe -DestinationPath $zip -Force

      - name: Upload standalone MCP server (Windows)
        if: matrix.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: flymd-mcp-Windows-x64
          # 带平台后缀：GitHub Release 不允许同名资产，
          # Linux 与 macOS 的产物默认都叫 flymd-mcp 会互相顶掉
          path: mcp-server/target/release-dist/flymd-mcp-windows-x64.exe
          if-no-files-found: error

      - name: Upload standalone MCP server (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: flymd-mcp-Linux-x64
          path: mcp-server/target/release-dist/flymd-mcp-linux-x64
          if-no-files-found: error

      - name: Upload standalone MCP server (macOS)
        if: startsWith(matrix.platform, 'macos-')
        uses: actions/upload-artifact@v4
        with:
          name: flymd-mcp-macOS-universal
          path: mcp-server/target/release-dist/flymd-mcp-macos-universal
          if-no-files-found: error

      - name: Upload artifacts (Windows Portable)
        if: matrix.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: flymd-${{ matrix.os }}-${{ matrix.arch }}-portable
          path: src-tauri/target/release/bundle/portable/*.zip
          if-no-files-found: error

      - name: Upload artifacts (Windows)
        if: matrix.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: flymd-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Upload artifacts (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: flymd-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: warn

      - name: Upload artifacts (macOS)
        if: startsWith(matrix.platform, 'macos-')
        uses: actions/upload-artifact@v4
        with:
          name: flymd-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.zip
          if-no-files-found: warn

  # 可选：创建 Release
  create-release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # 建 Release 需要写仓库内容。workflow 级别已把 GITHUB_TOKEN 降到
    # contents: read（门禁先行用的），这里单独为本 job 提权到 write。
    # 少了这段，softprops/action-gh-release 会以 403 失败。
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            flymd-Windows-x64/**/*
            flymd-Windows-x64-portable/**/*
            flymd-Linux-x64/**/*
            flymd-macOS-universal/**/*
            flymd-mcp-Windows-x64/**/*
            flymd-mcp-Linux-x64/**/*
            flymd-mcp-macOS-universal/**/*
          draft: true
          generate_release_notes: true






